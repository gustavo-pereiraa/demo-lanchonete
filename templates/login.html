<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6f1">
  <meta name="robots" content="noindex">
  <title>Acesso ao painel | Cantinho Santos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
{% include "_icons.html" %}
<main>
  <form class="login-card" method="post" id="loginForm" aria-labelledby="loginTitle">
    <span class="brand-mark" aria-hidden="true">CS</span>
    <div>
      <h1 id="loginTitle">Painel do Cantinho Santos</h1>
      <p class="login-sub">Entre para acompanhar e gerenciar os pedidos.</p>
    </div>
    {% if error %}<div class="alert" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg><span>{{ error }}</span></div>{% endif %}
    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" name="email" required autocomplete="username" autofocus{% if error %} aria-invalid="true"{% endif %}>
    </div>
    <div class="field">
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" name="password" required autocomplete="current-password"{% if error %} aria-invalid="true"{% endif %}>
    </div>
    <button class="btn btn--primary btn--block btn--lg" type="submit" id="loginBtn">Entrar</button>
    <p class="login-foot"><a href="/">Ver o cardápio</a></p>
  </form>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
